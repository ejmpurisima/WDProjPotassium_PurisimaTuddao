<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beyond the Border: A Guide to Alice in Borderland</title>
    <link rel="icon" type="image/x-icon" href="others/clubs.png">
    
    <link rel="stylesheet" href="../style.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manufacturing+Consent&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Vujahday+Script&display=swap" rel="stylesheet">
</head>

<body>
<div class="topbar">
    <img src="./others/Joker_29.png" class="menu-button" onclick="openMenu()">
    <span class="open-menu-text">Open Menu</span>
    <h1 class="title">Alice In Borderland</h1>
</div>

<div id="drawerMenu" class="drawer">
    <div class="drawer-content">
        <img src="./others/Joker_29.png" class="drawer-close" onclick="closeMenu()">
        <span id="menuLabel" class="menu-label">MENU</span>

        <a href="../index.html" class="icon-link" data-label="Home">
            <img src="./others/home.png" class="menu-icon">
        </a>
        <a href="clubsspecialists.html" class="icon-link" data-label="Clubs">
            <img src="./others/clubs.png" class="menu-icon">
        </a>
        <a href="diamondsspecialists.html" class="icon-link" data-label="Diamonds">
            <img src="./others/diamonds.png" class="menu-icon">
        </a>
        <a href="spadesspecialists.html" class="icon-link" data-label="Spades">
            <img src="./others/spades.png" class="menu-icon">
        </a>
        <a href="heartsspecialists.html" class="icon-link" data-label="Hearts">
            <img src="./others/hearts.png" class="menu-icon">
        </a>
        <a href="about.html" class="icon-link" data-label="About Us">
            <img src="./others/about.png" class="menu-icon">
        </a>
        <a href="quiz.html" class="icon-link" data-label="Quiz">
            <img src="./others/quizicon.png" class="menu-icon">
        </a>
        <a href="rating.html" class="icon-link" data-label="Episode Rating">
            <img src="./others/ratingicon.png" class="menu-icon">
        </a>
    </div>
</div>

<header class="site-header">
    <img src="./headers/header.png" alt="Website Header">
</header>

<main class="main-content-box rating-container">
    <h2>Rate an Episode</h2>
    
   <div class="form-group">
    <label>Select Season:</label>
    <select id="season" onchange="updateEpisodeDropdown()">
        <option value="" disabled selected>Choose Season</option>
        <option value="1">Season 1</option>
        <option value="2">Season 2</option>
        <option value="3">Season 3</option> </select>
</div>

    <div class="form-group">
        <label>Select Episode:</label>
        <select id="episode" disabled>
            <option value="" disabled selected>Select Season first</option>
        </select>
    </div>

    <div class="form-group">
        <label>Notes/Observations:</label>
        <textarea id="notes" placeholder="Yap all you want!"></textarea>
    </div>

    <label>Rating:</label>
    <div class="stars star-rating" id="starContainer">
        <span class="star" data-value="1">★</span>
        <span class="star" data-value="2">★</span>
        <span class="star" data-value="3">★</span>
        <span class="star" data-value="4">★</span>
        <span class="star" data-value="5">★</span>
    </div>

    <button id="addBtn" class="submit-btn" onclick="logEpisode()">Log Entry</button>

    <hr style="margin: 40px 0; border: 0; border-top: 1px solid #700;">
    
    <h3>Your Ratings</h3>
    <div id="episodeList"></div>
</main>

<footer class="site-footer">
    <div class="footer-content">
        <a href="sources.html" class="sources-btn">Sources</a>
        <span class="copyright">© 2026 BiggieWiki</span>
    </div>
</footer>

<script src="js/rating.js"></script>
<script src="js/menu.js"></script>
<script src="js/quiz.js"></script>

</body>
</html>
