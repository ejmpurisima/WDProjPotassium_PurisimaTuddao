<!DOCTYPE html>
<html>
<head>
    <title> Beyond the Border: A Guide to Alice in Borderland </title>
    <link rel="stylesheet" href="ourstyle.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gelasio:wght@400..700&display=swap" rel="stylesheet">

</head>

<body>
<div class="topbar">
    <img src="Joker_29.png" class="menu-button" onclick="openMenu()">
    <span class="open-menu-text">Open Menu</span>
        <h1 class="title">Alice In Borderland</h1>
</div>

<div id="drawerMenu" class="drawer">
    <div class="drawer-content">
        <img src="Joker_29.png" class="drawer-close" onclick="closeMenu()">
        <span id="menuLabel" class="menu-label">MENU</span>

<a href="index.html" class="icon-link" data-label="Home">
    <img src="home.png" class="menu-icon">
</a>

<a href="clubsspecialists.html" class="icon-link" data-label="Clubs">
    <img src="clubs.png" class="menu-icon">
</a>

<a href="diamondsspecialists.html" class="icon-link" data-label="Diamonds">
    <img src="diamonds.png" class="menu-icon">
</a>

<a href="spadesspecialists.html" class="icon-link" data-label="Spades">
    <img src="spades.png" class="menu-icon">
</a>

<a href="heartsspecialists.html" class="icon-link" data-label="Hearts">
    <img src="hearts.png" class="menu-icon">
</a>

<a href="#" class="icon-link" data-label="About Us">
    <img src="about.png" class="menu-icon">
</a>

    </div>
</div>

    <header class="site-header">
        <img src="heartsheader.png" alt="Website Header">
    </header>


    <div class="icon-section">
    <a href="heartsgames.html" class="nav-icon active">
        <img src="gamesbutton1.png" alt="Games">
    </a>

    <a href="heartsspecialists.html" class="nav-icon">
        <img src="specialistsbutton2.png" alt="Specialists">
    </a>
</div>


<div class="results-screen">
  <div class="screen-header">GAME RESULTS</div>
  <div class="screen-content" id="screenContent">
    <p class="screen-text">Click on any character to reveal their fate.</p>
  </div>
</div>

<div class="participants">
  <img src="arisu.jpg" alt="Arisu" class="participant-icon" data-label="Arisu">
<img src="karube.jpg" alt="Karube" class="participant-icon" data-label="Karube">
<img src="chota.jpg" alt="Chota" class="participant-icon" data-label="Chota">
<img src="shibuki.jpg" alt="Shibuki" class="participant-icon" data-label="Shibuki">

</div>


<script>
const screenContent = document.getElementById('screenContent');

const participants = {
  'Arisu': {
    name: 'Ryohei Arisu',
    status: 'CLEARED',
    text: 'Arisu survived the game by making smart choices and helping his friends.',
    img: 'arisu.jpg'
  },
  'Karube': {
    name: 'Daikichi Karube',
    status: 'ELIMINATED',
    text: 'Killed by collar explosion.',
    img: 'karube.jpg'
  },
  'Chota': {
    name: 'Chota Segawa',
    status: 'ELIMINATED',
    text: 'Killed by collar explosion.',
    img: 'chota.jpg'
  },
  'Shibuki': {
    name: 'Saori Shibuki',
    status: 'ELIMINATED',
    text: 'Killed by collar explosion.',
    img: 'shibuki.jpg'
  }
};

document.querySelectorAll('.participant-icon').forEach(icon => {
  icon.addEventListener('click', () => {
    const key = icon.alt;
    const info = participants[key];

    screenContent.style.opacity = 0;

    setTimeout(() => {
      screenContent.innerHTML = `
        <div class="info-left">
          <div class="character-name">${info.name}</div>
          <div class="status ${info.status.toLowerCase()}">
            STATUS: ${info.status}
          </div>
          <div class="info-text">${info.text}</div>
        </div>

        <div class="info-right">
          <img src="${info.img}" alt="${info.name}" class="character-image">
        </div>
      `;

      screenContent.style.opacity = 1;
    }, 200);
  });
});
</script>


    <footer>
        <div style="height: 10px; background-color: #ffffff;"></div>
        <p>&copy; 2025 BOI</p>
    </footer>

    <script>
        function openMenu() {
            document.getElementById("drawerMenu").style.width = "100%";
        }
        function closeMenu() {
            document.getElementById("drawerMenu").style.width = "0";
        }
    </script>








</body>
</html>
